<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>vcPerms</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Permission manager for Pumpkin. Groups, tracks, contexts.">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #6d28d9;
    }
    .sidebar-nav > ul > li > p {
      margin: 0.6em 0 0.2em;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "vcPerms",
      repo: "likhoded/vcPerms",
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        paths: "auto",
        placeholder: "Search / поиск",
        noData: "No results"
      },
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md"
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
